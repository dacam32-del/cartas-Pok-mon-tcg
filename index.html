<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colección Pokémon TCG de David</title>
  <meta name="description" content="Catálogo de cartas Pokémon TCG de David con precios aproximados en CLP.">
  <link rel="stylesheet" href="style.css?v=20261012a">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="pokeball" aria-hidden="true"></div>
      <div>
        <h1>Mi Colección Pokémon TCG</h1>
        <p class="sub">Catálogo y precios aproximados en pesos chilenos</p>
      </div>
      <a class="wa-btn wa-header" href="https://wa.me/56956592453?text=Hola%2C%20vi%20tu%20colecci%C3%B3n%20de%20cartas%20Pok%C3%A9mon" target="_blank" rel="noopener"><svg viewBox="0 0 32 32" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M16 3C9 3 3.3 8.6 3.3 15.6c0 2.5.7 4.8 1.9 6.8L3 29l6.8-2.1c1.9 1 4 1.6 6.2 1.6 7 0 12.7-5.7 12.7-12.7S23 3 16 3zm0 23.2c-2 0-3.9-.6-5.5-1.6l-.4-.2-4 1.2 1.3-3.9-.3-.4a10.4 10.4 0 1 1 8.9 4.9zm5.7-7.8c-.3-.2-1.8-.9-2.1-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8.5 8.5 0 0 1-4.2-3.7c-.3-.5.3-.5.9-1.6.1-.2 0-.4 0-.5l-1-2.3c-.2-.6-.5-.5-.7-.5h-.6a1.1 1.1 0 0 0-.8.4 3.4 3.4 0 0 0-1.1 2.5 5.9 5.9 0 0 0 1.2 3.1c.2.2 2 3.1 4.9 4.3 1.8.8 2.5.8 3.4.7.6-.1 1.8-.7 2-1.4s.3-1.3.2-1.4-.3-.2-.6-.3z"/></svg><span>WhatsApp</span></a>
    </div>
    <div class="stats">
      <div class="stat"><span id="stat-count">–</span><small>cartas en stock · <b id="stat-distinct"></b></small></div>
      <div class="stat"><span id="stat-market">–</span><small>valor mercado</small></div>
      <div class="stat"><span id="stat-suggested">–</span><small>valor sugerido</small></div>
    </div>
  </header>

  <section class="controls">
    <input id="search" type="search" placeholder="Buscar por nombre, set, ilustrador…" aria-label="Buscar cartas">
    <select id="sort" aria-label="Ordenar">
      <option value="precio-desc">Precio: mayor a menor</option>
      <option value="precio-asc">Precio: menor a mayor</option>
      <option value="anio-desc">Año: más nuevo</option>
      <option value="anio-asc">Año: más antiguo</option>
      <option value="nombre-asc">Nombre: A → Z</option>
      <option value="set-asc">Set: A → Z</option>
    </select>
    <div id="idiomas" class="chips" role="group" aria-label="Filtrar por idioma"></div>
  </section>

  <main>
    <p id="empty" class="empty" hidden>No se encontraron cartas.</p>
    <div id="grid" class="grid"></div>
  </main>

  <footer>
    <p id="footer-info"></p>
    <p>Precios de referencia según TCGplayer (estado NM) convertidos a CLP. El valor real depende del estado de cada carta.</p>
  </footer>

  <script src="app.js?v=20261012a"></script>
</body>
</html>
